name: Build & Release

on:
  push:
    tags:
      - 'v*' # 只有打 v 开头的 tag (如 v1.0.0) 时才触发发布构建
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # 缓存 npm 依赖，加快构建速度 (虽然我们用pnpm，但setup-node支持)

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install

      # 原生模块 rebuild 在 install 的 postinstall 钩子中已自动处理
      # 但为了保险，针对 Linux 需要确保依赖库存在
      - name: Install Linux Deps (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libicns-utils graphicsmagick

      - name: Build & Release
        env:
          # 必须配置 GitHub Token 才能上传 Release 产物
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: pnpm build:electron
