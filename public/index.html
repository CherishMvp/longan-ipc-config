<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPC设备气体配置管理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }
    
    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #eee;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
    }
    
    .form-group label {
      font-size: 14px;
      color: #666;
      margin-bottom: 6px;
      font-weight: 500;
    }
    
    .form-group input, .form-group select {
      padding: 10px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn-success {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
    }
    
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(17, 153, 142, 0.4);
    }
    
    .btn-danger {
      background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
      color: white;
    }
    
    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(235, 51, 73, 0.4);
    }
    
    .btn-info {
      background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
      color: white;
    }
    
    .btn-info:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(33, 147, 176, 0.4);
    }
    
    .btn-warning {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
    }
    
    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }
    
    .device-list {
      margin-top: 16px;
    }
    
    .device-item {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: all 0.3s;
    }
    
    .device-item:hover {
      background: #e9ecef;
    }
    
    .device-info {
      display: flex;
      flex-direction: column;
    }
    
    .device-info strong {
      color: #333;
      font-size: 14px;
    }
    
    .device-info span {
      color: #666;
      font-size: 12px;
    }
    
    .device-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .add-device-form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
      padding: 16px;
      background: #e8f4fd;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    
    .batch-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    
    .log-container {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 16px;
      max-height: 500px;
      overflow-y: auto;
      font-family: 'Consolas', 'Monaco', monospace;
    }
    
    .log-entry {
      padding: 8px 12px;
      margin-bottom: 4px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-all;
    }
    
    .log-entry.info {
      background: rgba(33, 147, 176, 0.2);
      color: #6dd5ed;
    }
    
    .log-entry.success {
      background: rgba(56, 239, 125, 0.2);
      color: #38ef7d;
    }
    
    .log-entry.error {
      background: rgba(235, 51, 73, 0.2);
      color: #f45c43;
    }
    
    .log-entry.warning {
      background: rgba(245, 87, 108, 0.2);
      color: #f5576c;
    }
    
    .log-time {
      color: #888;
      margin-right: 10px;
    }
    
    .config-display {
      background: #2d2d2d;
      padding: 12px;
      border-radius: 6px;
      margin-top: 8px;
      color: #e0e0e0;
      font-size: 12px;
    }
    
    .config-display pre {
      margin: 0;
      white-space: pre-wrap;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #888;
    }
    
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    
    .status-online {
      background: #d4edda;
      color: #155724;
    }
    
    .status-offline {
      background: #f8d7da;
      color: #721c24;
    }
    
    .status-unknown {
      background: #e2e3e5;
      color: #383d41;
    }
    
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    
    @media (max-width: 1024px) {
      .two-column {
        grid-template-columns: 1fr;
      }
      
      .device-item {
        grid-template-columns: 1fr;
      }
      
      .add-device-form {
        grid-template-columns: 1fr;
      }
    }
    
    .clear-log-btn {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    
    .log-header {
      position: relative;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>IPC设备气体配置管理系统</h1>
    
    <!-- 全局配置 -->
    <div class="card">
      <div class="card-title">全局配置</div>
      <div class="form-row">
        <div class="form-group">
          <label>设备账号</label>
          <input type="text" id="globalUsername" value="admin" placeholder="输入设备账号">
        </div>
        <div class="form-group">
          <label>设备密码</label>
          <input type="password" id="globalPassword" value="admin123" placeholder="输入设备密码">
        </div>
        <div class="form-group">
          <label>Client ID</label>
          <input type="text" id="globalClientId" value="e5cd7e4891bf95d1d19206ce24a7b32e" placeholder="输入Client ID">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group" style="grid-column: span 2;">
          <label>数据上传地址 (UploadPath)</label>
          <input type="text" id="globalUploadPath" value="http://192.168.0.38:8080/endWebApi/acceptTransparentData" placeholder="输入数据上传地址">
        </div>
        <div class="form-group">
          <label>波特率 (BaudRate)</label>
          <select id="globalBaudRate">
            <option value="9600">9600</option>
            <option value="19200">19200</option>
            <option value="38400">38400</option>
            <option value="57600">57600</option>
            <option value="115200" selected>115200</option>
          </select>
        </div>
        <div class="form-group">
          <label>启用状态 (Enable)</label>
          <select id="globalEnable">
            <option value="1">启用 (1)</option>
            <option value="0">禁用 (0)</option>
          </select>
        </div>
      </div>
    </div>
    
    <div class="two-column">
      <!-- 设备管理 -->
      <div class="card">
        <div class="card-title">设备管理</div>
        
        <!-- 添加设备表单 -->
        <div class="add-device-form">
          <div class="form-group">
            <label>设备名称</label>
            <input type="text" id="newDeviceName" placeholder="如: 1号摄像头">
          </div>
          <div class="form-group">
            <label>设备IP</label>
            <input type="text" id="newDeviceIP" placeholder="如: 192.168.1.100">
          </div>
          <div class="form-group">
            <label>AuthID (SN)</label>
            <input type="text" id="newDeviceAuthId" placeholder="如: 00001">
          </div>
          <button class="btn btn-primary" onclick="addDevice()">添加设备</button>
        </div>
        
        <!-- 设备列表 -->
        <div class="device-list" id="deviceList">
          <div class="empty-state">暂无设备，请添加IPC设备</div>
        </div>
        
        <!-- 批量操作 -->
        <div class="batch-actions">
          <button class="btn btn-info" onclick="batchGetConfig()">批量获取配置</button>
          <button class="btn btn-success" onclick="batchSetConfig()">批量设置配置</button>
          <button class="btn btn-danger" onclick="clearDevices()">清空设备</button>
        </div>
      </div>
      
      <!-- 运行日志 -->
      <div class="card">
        <div class="card-title log-header">
          运行日志
          <button class="btn btn-sm btn-danger clear-log-btn" onclick="clearLog()">清空日志</button>
        </div>
        <div class="log-container" id="logContainer">
          <div class="log-entry info">
            <span class="log-time">[系统]</span>
            欢迎使用IPC设备气体配置管理系统
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // 设备列表
    let devices = [];
    
    // 从localStorage加载设备
    function loadDevices() {
      const saved = localStorage.getItem('ipc_devices');
      if (saved) {
        devices = JSON.parse(saved);
        renderDeviceList();
      }
    }
    
    // 保存设备到localStorage
    function saveDevices() {
      localStorage.setItem('ipc_devices', JSON.stringify(devices));
    }
    
    // 加载全局配置
    function loadGlobalConfig() {
      const config = localStorage.getItem('ipc_global_config');
      if (config) {
        const c = JSON.parse(config);
        document.getElementById('globalUsername').value = c.username || 'admin';
        document.getElementById('globalPassword').value = c.password || 'admin123';
        document.getElementById('globalClientId').value = c.clientId || 'e5cd7e4891bf95d1d19206ce24a7b32e';
        document.getElementById('globalUploadPath').value = c.uploadPath || '';
        document.getElementById('globalBaudRate').value = c.baudRate || '115200';
        document.getElementById('globalEnable').value = c.enable || '1';
      }
    }
    
    // 保存全局配置
    function saveGlobalConfig() {
      const config = {
        username: document.getElementById('globalUsername').value,
        password: document.getElementById('globalPassword').value,
        clientId: document.getElementById('globalClientId').value,
        uploadPath: document.getElementById('globalUploadPath').value,
        baudRate: document.getElementById('globalBaudRate').value,
        enable: document.getElementById('globalEnable').value
      };
      localStorage.setItem('ipc_global_config', JSON.stringify(config));
    }
    
    // 获取全局配置
    function getGlobalConfig() {
      return {
        username: document.getElementById('globalUsername').value,
        password: document.getElementById('globalPassword').value,
        clientId: document.getElementById('globalClientId').value,
        uploadPath: document.getElementById('globalUploadPath').value,
        baudRate: parseInt(document.getElementById('globalBaudRate').value),
        enable: parseInt(document.getElementById('globalEnable').value)
      };
    }
    
    // 添加设备
    function addDevice() {
      const name = document.getElementById('newDeviceName').value.trim();
      const ip = document.getElementById('newDeviceIP').value.trim();
      const authId = document.getElementById('newDeviceAuthId').value.trim();
      
      if (!name || !ip || !authId) {
        log('error', '请填写完整的设备信息');
        return;
      }
      
      // 检查IP是否重复
      if (devices.find(d => d.ip === ip)) {
        log('error', `设备IP ${ip} 已存在`);
        return;
      }
      
      devices.push({
        id: Date.now(),
        name,
        ip,
        authId,
        status: 'unknown'
      });
      
      saveDevices();
      saveGlobalConfig();
      renderDeviceList();
      
      // 清空输入
      document.getElementById('newDeviceName').value = '';
      document.getElementById('newDeviceIP').value = '';
      document.getElementById('newDeviceAuthId').value = '';
      
      log('success', `设备 "${name}" (${ip}) 添加成功`);
    }
    
    // 删除设备
    function removeDevice(id) {
      const device = devices.find(d => d.id === id);
      if (device && confirm(`确定要删除设备 "${device.name}" 吗？`)) {
        devices = devices.filter(d => d.id !== id);
        saveDevices();
        renderDeviceList();
        log('warning', `设备 "${device.name}" 已删除`);
      }
    }
    
    // 清空设备
    function clearDevices() {
      if (devices.length === 0) {
        log('warning', '设备列表为空');
        return;
      }
      if (confirm('确定要清空所有设备吗？')) {
        devices = [];
        saveDevices();
        renderDeviceList();
        log('warning', '已清空所有设备');
      }
    }
    
    // 渲染设备列表
    function renderDeviceList() {
      const container = document.getElementById('deviceList');
      
      if (devices.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无设备，请添加IPC设备</div>';
        return;
      }
      
      container.innerHTML = devices.map(device => `
        <div class="device-item" id="device-${device.id}">
          <div class="device-info">
            <strong>${device.name}</strong>
            <span>IP: ${device.ip}</span>
          </div>
          <div class="device-info">
            <strong>AuthID</strong>
            <span>${device.authId}</span>
          </div>
          <div class="device-info">
            <strong>状态</strong>
            <span class="status-badge status-${device.status}">${getStatusText(device.status)}</span>
          </div>
          <div class="device-actions">
            <button class="btn btn-sm btn-info" onclick="getDeviceConfig(${device.id})">获取配置</button>
            <button class="btn btn-sm btn-success" onclick="setDeviceConfig(${device.id})">设置配置</button>
            <button class="btn btn-sm btn-danger" onclick="removeDevice(${device.id})">删除</button>
          </div>
        </div>
      `).join('');
    }
    
    // 获取状态文本
    function getStatusText(status) {
      const map = {
        'online': '在线',
        'offline': '离线',
        'unknown': '未知'
      };
      return map[status] || '未知';
    }
    
    // 获取单个设备配置
    async function getDeviceConfig(id) {
      const device = devices.find(d => d.id === id);
      if (!device) return;
      
      const config = getGlobalConfig();
      log('info', `正在获取设备 "${device.name}" (${device.ip}) 的配置...`);
      
      try {
        const response = await fetch('/api/getConfig', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ip: device.ip,
            username: config.username,
            password: config.password,
            clientId: config.clientId
          })
        });
        
        const result = await response.json();
        
        if (result.success) {
          device.status = 'online';
          saveDevices();
          renderDeviceList();
          log('success', `设备 "${device.name}" 配置获取成功:`);
          logConfig(result.data);
        } else {
          device.status = 'offline';
          saveDevices();
          renderDeviceList();
          log('error', `设备 "${device.name}" 配置获取失败: ${result.error}`);
        }
      } catch (error) {
        device.status = 'offline';
        saveDevices();
        renderDeviceList();
        log('error', `设备 "${device.name}" 请求异常: ${error.message}`);
      }
    }
    
    // 设置单个设备配置
    async function setDeviceConfig(id) {
      const device = devices.find(d => d.id === id);
      if (!device) return;
      
      const globalConfig = getGlobalConfig();
      
      const deviceConfig = {
        AuthID: device.authId,
        BaudRate: globalConfig.baudRate,
        Enable: globalConfig.enable,
        UploadPath: globalConfig.uploadPath
      };
      
      log('info', `正在设置设备 "${device.name}" (${device.ip}) 的配置...`);
      log('info', `配置内容: AuthID=${device.authId}, BaudRate=${globalConfig.baudRate}, Enable=${globalConfig.enable}`);
      
      try {
        const response = await fetch('/api/setConfig', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ip: device.ip,
            username: globalConfig.username,
            password: globalConfig.password,
            clientId: globalConfig.clientId,
            config: deviceConfig
          })
        });
        
        const result = await response.json();
        
        if (result.success) {
          device.status = 'online';
          saveDevices();
          renderDeviceList();
          log('success', `设备 "${device.name}" 配置设置成功:`);
          logConfig(result.data);
        } else {
          device.status = 'offline';
          saveDevices();
          renderDeviceList();
          log('error', `设备 "${device.name}" 配置设置失败: ${result.error}`);
        }
      } catch (error) {
        device.status = 'offline';
        saveDevices();
        renderDeviceList();
        log('error', `设备 "${device.name}" 请求异常: ${error.message}`);
      }
    }
    
    // 批量获取配置
    async function batchGetConfig() {
      if (devices.length === 0) {
        log('warning', '设备列表为空，请先添加设备');
        return;
      }
      
      const config = getGlobalConfig();
      log('info', `开始批量获取 ${devices.length} 台设备的配置...`);
      
      try {
        const response = await fetch('/api/batchGetConfig', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            devices: devices.map(d => ({ ip: d.ip, name: d.name })),
            username: config.username,
            password: config.password,
            clientId: config.clientId
          })
        });
        
        const result = await response.json();
        
        let successCount = 0;
        let failCount = 0;
        
        result.results.forEach(r => {
          const device = devices.find(d => d.ip === r.ip);
          if (device) {
            device.status = r.success ? 'online' : 'offline';
          }
          
          if (r.success) {
            successCount++;
            log('success', `[${r.name}] 配置获取成功:`);
            logConfig(r.data);
          } else {
            failCount++;
            log('error', `[${r.name}] 配置获取失败: ${r.error}`);
          }
        });
        
        saveDevices();
        renderDeviceList();
        log('info', `批量获取完成: 成功 ${successCount} 台, 失败 ${failCount} 台`);
      } catch (error) {
        log('error', `批量获取请求异常: ${error.message}`);
      }
    }
    
    // 批量设置配置
    async function batchSetConfig() {
      if (devices.length === 0) {
        log('warning', '设备列表为空，请先添加设备');
        return;
      }
      
      if (!confirm(`确定要将全局配置应用到所有 ${devices.length} 台设备吗？`)) {
        return;
      }
      
      const config = getGlobalConfig();
      log('info', `开始批量设置 ${devices.length} 台设备的配置...`);
      log('info', `全局配置: UploadPath=${config.uploadPath}, BaudRate=${config.baudRate}, Enable=${config.enable}`);
      
      try {
        const response = await fetch('/api/batchSetConfig', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            devices: devices.map(d => ({ ip: d.ip, name: d.name, authId: d.authId })),
            username: config.username,
            password: config.password,
            clientId: config.clientId,
            uploadPath: config.uploadPath,
            baudRate: config.baudRate,
            enable: config.enable
          })
        });
        
        const result = await response.json();
        
        let successCount = 0;
        let failCount = 0;
        
        result.results.forEach(r => {
          const device = devices.find(d => d.ip === r.ip);
          if (device) {
            device.status = r.success ? 'online' : 'offline';
          }
          
          if (r.success) {
            successCount++;
            log('success', `[${r.name}] 配置设置成功:`);
            logConfig(r.data);
          } else {
            failCount++;
            log('error', `[${r.name}] 配置设置失败: ${r.error}`);
          }
        });
        
        saveDevices();
        renderDeviceList();
        log('info', `批量设置完成: 成功 ${successCount} 台, 失败 ${failCount} 台`);
      } catch (error) {
        log('error', `批量设置请求异常: ${error.message}`);
      }
    }
    
    // 日志函数
    function log(type, message) {
      const container = document.getElementById('logContainer');
      const time = new Date().toLocaleTimeString();
      
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.innerHTML = `<span class="log-time">[${time}]</span>${message}`;
      
      container.appendChild(entry);
      container.scrollTop = container.scrollHeight;
    }
    
    // 日志显示配置
    function logConfig(config) {
      const container = document.getElementById('logContainer');
      
      const entry = document.createElement('div');
      entry.className = 'config-display';
      entry.innerHTML = `<pre>${JSON.stringify(config, null, 2)}</pre>`;
      
      container.appendChild(entry);
      container.scrollTop = container.scrollHeight;
    }
    
    // 清空日志
    function clearLog() {
      const container = document.getElementById('logContainer');
      container.innerHTML = `
        <div class="log-entry info">
          <span class="log-time">[系统]</span>
          日志已清空
        </div>
      `;
    }
    
    // 监听全局配置变化
    document.querySelectorAll('#globalUsername, #globalPassword, #globalClientId, #globalUploadPath, #globalBaudRate, #globalEnable').forEach(el => {
      el.addEventListener('change', saveGlobalConfig);
    });
    
    // 初始化
    loadGlobalConfig();
    loadDevices();
  </script>
</body>
</html>
